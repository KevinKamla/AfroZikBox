<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <img src="assets/icon/logo.png" alt="logo">
    </div>
    
    <!-- Title -->
    <h2 class="title">Connectez-vous à votre compte</h2>
    
    <!-- Login Form -->
    <form (submit)="loginPressed()">
      <!-- Email Field -->
      <ion-item class="input-field">
        <ion-icon name="mail-outline" slot="start"></ion-icon>
        <ion-input [(ngModel)]="username" name="username" type="email" placeholder="E-mail" required></ion-input>
      </ion-item>
      
      <!-- Password Field -->
      <ion-item class="input-field">
        <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
        <ion-input [(ngModel)]="password" name="password" type="password" placeholder="Mot de passe" required></ion-input>
      </ion-item>

      <!-- Remember Me Checkbox -->
      <ion-item lines="none" class="remember-me">
        <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe" slot="start"></ion-checkbox>
        <ion-label>Souviens-toi de moi</ion-label>
      </ion-item>
      
      <!-- Error Message -->
      <ion-text color="danger" *ngIf="errorMessage">
        <p>{{ errorMessage }}</p>
      </ion-text>
      
      <!-- Login Button -->
      <ion-button expand="block" shape="round" color="warning" type="submit">
        Se connecter
      </ion-button>
      
      <!-- Forgot Password Link -->
      <p class="forgot-password" [routerLink]="['/resetpassword']">Mot de passe oublié?</p>
    </form>

    <!-- Social Login Options -->
    <div class="social-login">
      <ion-text color="medium">ou continuer avec</ion-text>
      <ion-button expand="block" color="primary" shape="round" (click)="loginWithGoogle()">
        <ion-icon name="logo-google" slot="start"></ion-icon>
        Connexion avec Google
      </ion-button>
      <ion-button expand="block" color="dark" shape="round" (click)="loginWithApple()">
        <ion-icon name="logo-apple" slot="start"></ion-icon>
        Connexion avec Apple
      </ion-button>
    </div>

    <!-- Sign Up Link -->
    <p class="sign-up">Vous n'avez pas encore de compte ? <span [routerLink]="['/register']">S'inscrire</span></p>
  </div>
</ion-content>
