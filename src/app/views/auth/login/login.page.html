 

<ion-content [fullscreen]="true" class="auth-page">
  <div class="gradient-background">
    <div class="login-container">
      <div class="logo-container">
        <img src="assets/icon/logo.png" alt="AfroZikBox" class="animated-logo">
      </div>
      
      <h1 class="welcome-text">Bienvenue sur AfroZikBox</h1>
      <p class="tagline">Votre musique, votre style</p>

      <form (submit)="loginPressed()" class="login-form">
        <div class="input-group">
          <div class="input-wrapper">
            <ion-icon name="person" color="light"></ion-icon>
            <ion-input class="custom-input" [(ngModel)]="username" name="username" 
                      type="text" label="Username" 
                      labelPlacement="floating"></ion-input>
          </div>

          <div class="input-wrapper">
            <ion-icon name="lock-closed" color="light"></ion-icon>
            <ion-input 
              class="custom-input" 
              [(ngModel)]="password" 
              name="password" 
              [type]="showPassword ? 'text' : 'password'"
              label="Mot de passe" 
              labelPlacement="floating">
            </ion-input>
            <ion-icon 
              [name]="showPassword ? 'eye-off' : 'eye'"
              color="light"
              (click)="togglePassword()"
              class="password-toggle">
            </ion-icon>
          </div>
          
          <div class="remember-me">
            <ion-checkbox [(ngModel)]="rememberMe" name="rememberMe" class="custom-checkbox">
              Se souvenir de moi
            </ion-checkbox>
          </div>
        </div>

        <ion-text color="danger" *ngIf="errorMessage">
          <p class="error-message">{{ errorMessage }}</p>
        </ion-text>

        <ion-button expand="block" class="login-button" type="submit">
          Se connecter
        </ion-button>

        <div class="additional-links">
          <a class="forgot-password" [routerLink]="['/resetpassword']">
            Mot de passe oublié?
          </a>
          <p class="register-link">
            Nouveau sur AfroZikBox? 
            <span [routerLink]="['/register']">Créer un compte</span>
          </p>
        </div>
      </form>
    </div>
  </div>
</ion-content>
