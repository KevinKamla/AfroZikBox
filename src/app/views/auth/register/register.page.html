<ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button></ion-back-button>
      </ion-buttons>
    </ion-toolbar>
  </ion-header>
  
  <ion-content [fullscreen]="true">
    <div class="container">
      <!-- Logo -->
      <div class="logo">
        <img src="assets/icon/logo.png" alt="logo">
      </div>
  
      <!-- Title -->
      <h2>Créer votre compte</h2>
  
      <!-- Registration Form -->
      <form (ngSubmit)="registerPressed()">
        <!-- Username Field -->
        <ion-item class="input-field">
          <ion-icon name="person-outline" slot="start"></ion-icon>
          <ion-input type="text" placeholder="Nom d'utilisateur" [(ngModel)]="username" name="username" required></ion-input>
        </ion-item>
  
        <!-- Email Field -->
        <ion-item class="input-field">
          <ion-icon name="mail-outline" slot="start"></ion-icon>
          <ion-input type="email" placeholder="E-mail" [(ngModel)]="email" name="email" required></ion-input>
        </ion-item>
  
        <!-- Password Field -->
        <ion-item class="input-field">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password" placeholder="Mot de passe" [(ngModel)]="password" name="password" required></ion-input>
          <ion-icon name="eye-off-outline" slot="end" (click)="togglePasswordVisibility()"></ion-icon>
        </ion-item>
  
        <!-- Confirm Password Field -->
        <ion-item class="input-field">
          <ion-icon name="lock-closed-outline" slot="start"></ion-icon>
          <ion-input type="password" placeholder="Confirmer le mot de passe" [(ngModel)]="confirmPassword" name="confirmPassword" required></ion-input>
          <ion-icon name="eye-off-outline" slot="end" (click)="toggleConfirmPasswordVisibility()"></ion-icon>
        </ion-item>
  
        <!-- Terms and Conditions -->
        <p class="terms-text">En vous inscrivant, vous acceptez nos</p>
        <p class="terms-link">Conditions d'utilisation</p>
  
        <!-- Submit Button -->
        <ion-button expand="block" shape="round" color="warning" type="submit">
          S'inscrire
        </ion-button>
      </form>
  
      <!-- Sign In Link -->
      <p class="sign-in-text">Vous avez déjà un compte ? <span [routerLink]="['/login']">Se connecter</span></p>
    </div>
  </ion-content>
