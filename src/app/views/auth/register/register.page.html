 
  
  <ion-content [fullscreen]="true" class="auth-page">
    <div class="gradient-background">
      <div class="register-container">
        <div class="logo-container">
          <img src="assets/icon/logo.png" alt="AfroZikBox" class="animated-logo">
        </div>
        
        <h1 class="welcome-text">Rejoignez AfroZikBox</h1>
        <p class="tagline">Créez votre compte en quelques étapes</p>
  
        <form (ngSubmit)="registerPressed()" class="register-form">
          <div class="input-group">
            <div class="input-wrapper">
              <ion-icon name="person" color="light"></ion-icon>
              <ion-input class="custom-input" [(ngModel)]="name" name="name" 
                        type="text" label="Nom & Prénom" 
                        labelPlacement="floating"></ion-input>
            </div>
  
            <div class="input-wrapper">
              <ion-icon name="person" color="light"></ion-icon>
              <ion-input class="custom-input" [(ngModel)]="username" name="username" 
                        type="text" label="Nom d'utilisateur" 
                        labelPlacement="floating"></ion-input>
            </div>
  
            <div class="input-wrapper">
              <ion-icon name="mail" color="light"></ion-icon>
              <ion-input class="custom-input" [(ngModel)]="email" name="email" 
                        type="email" label="E-mail" 
                        labelPlacement="floating"></ion-input>
            </div>
  
            <div class="input-wrapper">
              <ion-icon name="lock-closed" color="light"></ion-icon>
              <ion-input class="custom-input" [(ngModel)]="password" name="password" 
                        [type]="showPassword ? 'text' : 'password'" 
                        label="Mot de passe" 
                        labelPlacement="floating"></ion-input>
              <ion-icon [name]="showPassword ? 'eye-off' : 'eye'" 
                        color="light" 
                        (click)="togglePassword()"
                        style="cursor: pointer"></ion-icon>
            </div>
            
            <div class="input-wrapper">
              <ion-icon name="lock-closed" color="light"></ion-icon>
              <ion-input class="custom-input" [(ngModel)]="confirmPassword" name="confirmPassword" 
                        [type]="showConfirmPassword ? 'text' : 'password'" 
                        label="Confirmer le mot de passe" 
                        labelPlacement="floating"></ion-input>
              <ion-icon [name]="showConfirmPassword ? 'eye-off' : 'eye'" 
                        color="light" 
                        (click)="toggleConfirmPassword()"
                        style="cursor: pointer"></ion-icon>
            </div>
            
          </div>
  
          <div class="terms">
            <p>En vous inscrivant vous acceptez nos</p>
            <p class="terms-link">Conditions d'utilisations</p>
          </div>
  
          <ion-button expand="block" class="register-button" type="submit">
            S'inscrire
          </ion-button>
  
          <div class="additional-links">
            <p class="login-link">
              Vous avez déjà un compte? 
              <span [routerLink]="['/login']">Se connecter</span>
            </p>
          </div>
        </form>
      </div>
    </div>
  </ion-content>
