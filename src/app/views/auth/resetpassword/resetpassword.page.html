 
  
  <ion-content [fullscreen]="true" class="auth-page">
    <div class="gradient-background">
      <div class="reset-container">
        <div class="logo-container">
          <img src="assets/icon/logo.png" alt="AfroZikBox" class="animated-logo">
        </div>
        
        <h1 class="welcome-text">Mot de passe oublié?</h1>
        <div class="description">
          <p class="tagline">Veuillez entrer votre adresse e-mail</p>
          <p class="subtitle">Nous vous enverrons un lien pour réinitialiser votre mot de passe</p>
        </div>
  
        <form (ngSubmit)="forgotPassword()" class="reset-form">
          <div class="input-group">
            <div class="input-wrapper">
              <ion-icon name="mail" color="light"></ion-icon>
              <ion-input class="custom-input" 
                        [(ngModel)]="email" 
                        name="email" 
                        type="email" 
                        label="E-mail" 
                        labelPlacement="floating">
              </ion-input>
            </div>
          </div>
  
          <ion-button expand="block" class="reset-button" type="submit">
            Envoyer
          </ion-button>
        </form>
      </div>
    </div>
  </ion-content>
