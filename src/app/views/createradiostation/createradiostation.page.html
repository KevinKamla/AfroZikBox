<ion-header [translucent]="true" class="ion-no-border">
    <ion-toolbar>
        <ion-buttons slot="start">
            <ion-back-button></ion-back-button>
        </ion-buttons>
        <ion-buttons slot="start">
            <div class="bloc_search">
                <ion-searchbar
                    [(ngModel)]="searchKeyword"
                    (ionInput)="filterStations()"
                    placeholder="Recherche par mot-clé"
                    debounce="300"
                ></ion-searchbar>
            </div>
        </ion-buttons>
    </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
    <ion-title class="ion-text-center">Liste des stations</ion-title>

    <!-- List of stations -->
    <ion-list *ngIf="filteredStations.length > 0; else noStations">
        <ion-item *ngFor="let station of filteredStations">
            <ion-label>
                <h2>{{ station.name }}</h2>
                <p>{{ station.genre }} - {{ station.country }}</p>
            </ion-label>
        </ion-item>
    </ion-list>
    <ng-template #noStations>
        <ion-item>
            <ion-label>
                <h2>Aucune station disponible</h2>
            </ion-label>
        </ion-item>
    </ng-template>

    <!-- Button to open modal for adding a new station -->
    <ion-fab vertical="bottom" horizontal="end" slot="fixed">
        <ion-fab-button (click)="openAddStationModal()">
            <ion-icon name="add"></ion-icon>
        </ion-fab-button>
    </ion-fab>
</ion-content>

<!-- Modal for adding a new station -->
<ion-modal [isOpen]="isModalOpen" (didDismiss)="isModalOpen = false">
    <ng-template>
        <ion-header>
            <ion-toolbar>
                <ion-title>Ajouter une station</ion-title>
                <ion-buttons slot="end">
                    <ion-button (click)="closeAddStationModal()">Fermer</ion-button>
                </ion-buttons>
            </ion-toolbar>
        </ion-header>

        <ion-content>
            <form (ngSubmit)="onAddStation()">
                <ion-item>
                    <ion-label position="floating">Station ID</ion-label>
                    <ion-input type="number" [(ngModel)]="stationId" name="id" required></ion-input>
                </ion-item>

                <ion-item>
                    <ion-label position="floating">Nom de la Station</ion-label>
                    <ion-input type="text" [(ngModel)]="stationName" name="station" required></ion-input>
                </ion-item>

                <ion-item>
                    <ion-label position="floating">URL</ion-label>
                    <ion-input type="url" [(ngModel)]="stationUrl" name="url" required></ion-input>
                </ion-item>

                <ion-item>
                    <ion-label position="floating">Logo URL</ion-label>
                    <ion-input type="text" [(ngModel)]="stationLogo" type="file" (change)="onLogoSelected($event)" name="logo" required></ion-input>
                </ion-item>

                <!-- <ion-item>
                    <ion-label position="floating">Charger Logo</ion-label>
                    <input type="file" (change)="onLogoSelected($event)" />
                </ion-item> -->

                <ion-item>
                    <ion-label position="floating">Genre</ion-label>
                    <ion-input type="text" [(ngModel)]="stationGenre" name="genre" required></ion-input>
                </ion-item>

                <ion-item>
                    <ion-label position="floating">Country</ion-label>
                    <ion-input type="text" [(ngModel)]="stationCountry" name="country" required></ion-input>
                </ion-item>

                <ion-button expand="full" type="submit">Ajouter la Station</ion-button>
            </form>
        </ion-content>
    </ng-template>
</ion-modal>
