<ion-header [translucent]="true" class="ion-no-border">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button></ion-back-button>
      </ion-buttons>
      <ion-title>Créer une story</ion-title>
    </ion-toolbar>
  </ion-header>
  
  <ion-content [fullscreen]="true">
    <form [formGroup]="storyForm" (ngSubmit)="onSubmit()">
      <div class="d-f-c">
        <ion-card button (click)="camera()" class="ion-no-box-shadow">
          <ion-card-content class="image">
            <img *ngIf="isGetImg" [src]="imgPath" alt="Image sélectionnée">
            <div class="content" *ngIf="!isGetImg">
              <ion-icon slot="start" name="image"></ion-icon>
              <h5>Sélectionner l'image à importer</h5>
            </div>
          </ion-card-content>
        </ion-card>
  
        <ion-card button (click)="pickAudioFile()" class="ion-no-box-shadow">
            <ion-card-content class="image">
              <img *ngIf="imgMucic" [src]="imgMucic" alt="Icône musique">
              <div class="content" *ngIf="!imgMucic">
                <ion-icon slot="start" name="musical-notes"></ion-icon>
                <h5>Sélectionner la chanson à importer</h5>
              </div>
            </ion-card-content>
        </ion-card>
        <ion-item>
            <ion-label position="floating">Chanson sélectionnée</ion-label>
            <ion-input formControlName="audio" [value]="imgMucic" readonly></ion-input>
          </ion-item>
      </div>
  
      <ion-item>
        <ion-label position="floating">Titre de la story</ion-label>
        <ion-input formControlName="title" type="text" placeholder="Titre"></ion-input>
      </ion-item>
  
      <ion-item>
        <ion-label position="floating">Description</ion-label>
        <ion-textarea formControlName="description" placeholder="Description"></ion-textarea>
      </ion-item>
  
      <div class="input">
        <div class="canView d-f-s" (click)="openCanViewModal()">
          <ion-icon name="eye-outline"></ion-icon>
          <ion-input type="text" class="content" [value]="canview" readonly></ion-input>
        </div>
        <div class="canView d-f-c">
          <ion-icon name="link-outline"></ion-icon>
          <ion-input type="text" class="content" placeholder="Url"></ion-input>
        </div>
        <ion-button expand="block" shape="round" class="ion-margin" type="submit" [disabled]="storyForm.invalid || !imgMucic">
          Publier
        </ion-button>
      </div>
    </form>
  </ion-content>
