<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Modifier la photo de couverture</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="input">
    <!-- Input de fichier pour choisir la photo de couverture -->
    <ion-item>
      <input 
        type="file" 
        (change)="onFileSelected($event)" 
        accept="image/*">
    </ion-item>

    <!-- Bouton pour soumettre la photo de couverture -->
    <ion-button 
      expand="block" 
      shape="round" 
      class="ion-margin" 
      (click)="updateCover()"
      [disabled]="!coverFile">
      Sauvegarder la couverture
    </ion-button>
  </div>
</ion-content>
