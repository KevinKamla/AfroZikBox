  <ion-toolbar>

      <ion-button (click)="goToRoute()">
        <ion-icon slot="icon-only" name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="false" class="">
  <div
    class="bg-header"
    [ngStyle]="{'background-image': 'linear-gradient(#7436a314, #7436a3c2, rgb(0 0 0)), url(' + album.thumbnail + ')'}"
  >
    <div class="header">
      <ion-buttons slot="end">
        <!-- <ion-button fill="clear" [routerLink]="['/userinfo']">
          <ion-icon
            slot="icon-only"
            name="information-circle-outline"
          ></ion-icon>
        </ion-button> -->
        <ion-button fill="clear" id="openOptionProfil">
          <ion-icon
            slot="icon-only"
            name="ellipsis-horizontal-outline"
          ></ion-icon>
        </ion-button>
      </ion-buttons>
    </div>
    <div class="d-f-c block-img">
      <ion-avatar class="logo">
        <img
          [src]="album.thumbnail ? album.thumbnail : album.thumbnail"
          alt=""
        />
      </ion-avatar>
    </div>
    <ion-label>
      {{ album.title }}
      <!-- <ion-icon
        [color]="isAdmin ? 'tertiary' : 'success'"
        name="checkmark-circle-sharp"
      ></ion-icon> -->
    </ion-label>
    <!-- <ion-text>
            {{follower}} Followers - {{following}} Following
        </ion-text> -->
  </div>

  <ion-segment
    mode="md"
    scrollable
    scrollHide
    mode="md"
    [(ngModel)]="selectedSegment"
  >
    <ion-segment-button value="chansons">Chansons</ion-segment-button>
    <ion-segment-button value="album"> Commentaire</ion-segment-button>
    <ion-segment-button value="playlists">Détails</ion-segment-button>
    <!-- <ion-segment-button value="favoris">Favoris</ion-segment-button>
        <ion-segment-button value="activites">Activites</ion-segment-button>
        <ion-segment-button value="afroZikStore">AfroZikStore</ion-segment-button>
        <ion-segment-button value="radio">Radio</ion-segment-button>
        <ion-segment-button value="evénements">Evénements</ion-segment-button> -->
  </ion-segment>

  <ng-container [ngSwitch]="selectedSegment">
    <div style="padding-bottom: 3rem">
      <div *ngSwitchCase="'chansons'">
        <div class="list_chansons">
          <div *ngIf="albumSongs.length > 0; else ionSkeletonSon">
            <div
              class="ion-item d-f-s"
              *ngFor="let song of albumSongs; let i = index"
            >
              <img
                class="song-thumbnail"
                [src]="song.thumbnail"
                alt="{{ song.title }} Thumbnail"
              />

              <!-- Conteneur de la chanson avec les informations -->
              <div class="song-info">
                <h3>{{ song.title }}</h3>

                <!-- Affichage des détails de la chanson -->
                <div class="song-details">
                  <div class="detail-row">
                    <strong>Artiste :</strong>
                    <span>{{ song.publisher.username }}</span>
                  </div>
                  <!-- <div class="detail-row">
                        <strong>Genre :</strong>
                        <span>{{ song.genre }}</span>
                      </div>
                      <div class="detail-row">
                        <strong>Popularité :</strong>
                        <span>{{ song.popularity }}</span>
                      </div>
                      <div class="detail-row">
                        <strong>Durée :</strong>
                        <span>{{ song.duration | date: 'mm:ss' }}</span> 
                      </div> -->
                </div>
              </div>

              <!-- Boutons d'options de la chanson -->
              <div class="block-btn">
                <ion-button class="btn-play" (click)="loadsong(albumSongs, i)">
                  <ion-icon
                    color="primary"
                    slot="icon-only"
                    name="play-circle"
                  ></ion-icon>
                </ion-button>
                <ion-button (click)="openOptionSound(song.id)">
                  <ion-icon
                    slot="icon-only"
                    color="primary"
                    name="ellipsis-vertical-outline"
                  ></ion-icon>
                </ion-button>
              </div>
            </div>
          </div>

          <ng-template #ionSkeletonSon>
            <p class="p d-f-c">Rien à afficher pour l'instant</p>
          </ng-template>
        </div>
      </div>
